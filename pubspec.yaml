name: news
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.1
  equatable: ^2.1.0
  logger: ^2.7.0
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: any
  freezed: any
  json_annotation: any
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" # مسار صورتك (يفضل 1024x1024)
  min_sdk_android: 21
